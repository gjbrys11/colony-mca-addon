plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'dev.colonymca'
version = mod_version
base.archivesName = 'colony-mca-addon'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    uiSmoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
}

tasks.register('smokeClient', JavaExec) {
    dependsOn tasks.named('prepareClientRun'), tasks.named('uiSmokeClasses')
    classpath = sourceSets.main.output + sourceSets.uiSmoke.output + configurations.smokeRuntime
    mainClass = 'cpw.mods.bootstraplauncher.BootstrapLauncher'
    workingDir = file('run')
    systemProperty 'colony_mca.uiPreview', providers.gradleProperty('uiPreview').getOrElse('false')
    systemProperty 'colony_mca.gameplayVerify', providers.gradleProperty('gameplayVerify').getOrElse('false')
    doFirst {
        if (!Boolean.parseBoolean(providers.gradleProperty('uiPreview').getOrElse('false'))) {
            delete file('build/ui-smoke/result.txt')
        }
        jvmArgs "@${layout.buildDirectory.file('moddev/clientRunVmArgs.txt').get().asFile.absolutePath}"
        def arguments = layout.buildDirectory.file('moddev/clientRunProgramArgs.txt').get().asFile.readLines()
                .findAll { !it.isBlank() && !it.startsWith('#') }
        args arguments.drop(1)
        args '--quickPlaySingleplayer', 'ui-smoke', '--width', '1100', '--height', '740'
        environment 'MOD_CLASSES', (sourceSets.main.output.files + sourceSets.uiSmoke.output.files).collect {
            "colony_mca%%${it.absolutePath}"
        }.join(File.pathSeparator)
    }
    doLast {
        if (!Boolean.parseBoolean(providers.gradleProperty('uiPreview').getOrElse('false'))) {
            def result = file('build/ui-smoke/result.txt')
            if (!result.exists() || !result.text.startsWith('PASS:'))
                throw new GradleException("UI checks failed: ${result.exists() ? result.text : 'no result'}")
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://ldtteam.jfrog.io/artifactory/modding' }
}

neoForge {
    version = neoforge_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { colony_mca { sourceSet sourceSets.main } }
}

// Optional local copy of the official ModDev JSON for offline development.
if (providers.gradleProperty('neoForgeConfigFile').isPresent()) {
    configurations.named('neoForgeConfigOnly') {
        withDependencies { dependencies ->
            dependencies.clear()
            dependencies.add(project.dependencies.create(project.files(project.property('neoForgeConfigFile'))))
        }
    }
}

dependencies {
    // Local official release jars; never bundled in the addon.
    implementation files('libs/mca-7.7.36-neoforge.jar')
    implementation files('libs/minecolonies-1.1.1403.jar')
    implementation fileTree(dir: 'libs', include: ['structurize-*.jar', 'blockui-*.jar',
            'domum-ornamentum-*.jar', 'multipiston-*.jar'])
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('housingRegression', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.output + sourceSets.main.output
    mainClass = 'dev.colonymca.FamilyHousingRuleTest'
}
tasks.named('check') { dependsOn tasks.named('housingRegression') }

// Direct bootstrap permits a loading smoke test without the optional DevLaunch convenience jar.
def smokeRuntime = configurations.create('smokeRuntime') {
    extendsFrom configurations.runtimeClasspath
    canBeConsumed = false
    exclude group: 'net.neoforged', module: 'DevLaunch'
    configurations.runtimeClasspath.attributes.keySet().each { key ->
        attributes.attribute(key, configurations.runtimeClasspath.attributes.getAttribute(key))
    }
}
tasks.register('smokeServer', JavaExec) {
    dependsOn tasks.named('prepareServerRun'), tasks.named('smokeClasses')
    classpath = sourceSets.main.output + sourceSets.smoke.output + smokeRuntime
    mainClass = 'cpw.mods.bootstraplauncher.BootstrapLauncher'
    workingDir = file('run')
    doFirst {
        workingDir.mkdirs()
        delete file('build/smoke-result.txt')
        def propertiesFile = file('run/server.properties')
        if (propertiesFile.exists()) {
            def properties = new Properties()
            propertiesFile.withInputStream { properties.load(it) }
            properties.setProperty('server-ip', '127.0.0.1')
            properties.setProperty('server-port', '25566')
            properties.setProperty('enable-query', 'false')
            properties.setProperty('enable-rcon', 'false')
            propertiesFile.withOutputStream { properties.store(it, 'Isolated addon smoke-test server') }
        }
        jvmArgs "@${layout.buildDirectory.file('moddev/serverRunVmArgs.txt').get().asFile.absolutePath}"
        def arguments = layout.buildDirectory.file('moddev/serverRunProgramArgs.txt').get().asFile.readLines()
                .findAll { !it.isBlank() && !it.startsWith('#') }
        args arguments.drop(1)
        environment 'MOD_CLASSES', (sourceSets.main.output.files + sourceSets.smoke.output.files).collect {
            "colony_mca%%${it.absolutePath}"
        }.join(File.pathSeparator)
    }
    doLast {
        def result = file('build/smoke-result.txt')
        if (!result.exists() || !result.text.startsWith('PASS:')) throw new GradleException("Smoke checks failed: ${result.exists() ? result.text : 'no result'}")
    }
}
tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
